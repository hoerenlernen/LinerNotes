});

/* ---------------------------------------------------------------- Punkt 8
   Suche über die Bibliothek. Aufgelöst wird beim MinimServer; die
   Oberfläche schickt nur Album und Interpret zurück, keine URLs - so kann
   von außen keine beliebige Adresse in die Warteschlange gelegt werden. */
let suchTimer = null, letzteSuche = "";

function suchtrefferHtml(g){
  const titelzeile = g.titel.slice(0, 4).map(t => esc(t.titel)).join(" · ")
      + (g.anzahl > 4 ? " · …" : "");
  return `<div class="streffer" data-album="${esc(g.album||"")}" data-artist="${esc(g.artist||"")}">`+
    `<div class="kopf"><span class="al">${esc(g.album||"—")}</span>`+
    `<span class="ar">${esc(g.artist||"")}</span>`+
    `<span class="nz">${g.anzahl} ${g.anzahl===1?"Titel":"Titel"}</span>`+
    `<span class="tun">`+
      `<button data-tun="ersetzen">Album abspielen</button>`+
      `<button data-tun="anhaengen">Album anhängen</button>`+
    `</span></div>`+
    `<div class="tl">${titelzeile}</div></div>`;
}

async function suchen(text){
  if(text.length < 2){
    $("#suchergebnis").innerHTML = "";
    $("#suchhinweis").textContent = "";
    return;
  }
  $("#suchhinweis").textContent = "sucht …";
  try{
    const r = await fetch("/api/bibliothek/suche?q=" + encodeURIComponent(text));
    const d = await r.json();
    if(text !== letzteSuche) return;            // veraltete Antwort
    const t = d.treffer || [];
    $("#suchhinweis").textContent = t.length
        ? (d.gesamt > 0 ? t.length + " Alben · " + d.gesamt + " Titel gefunden" : "")
        : (d.fehler ? "Suche nicht möglich." : "Nichts gefunden.");
    $("#suchergebnis").innerHTML = t.map(suchtrefferHtml).join("");
  }catch(e){
    $("#suchhinweis").textContent = "Suche nicht möglich.";
  }
}

$("#suchfeld").addEventListener("input", e => {
  const text = e.target.value.trim();
  letzteSuche = text;
  if(suchTimer) clearTimeout(suchTimer);
  // Nicht bei jedem Tastendruck fragen - MinimServer durchsucht 48.000 Titel.
  suchTimer = setTimeout(() => suchen(text), 350);
});

$("#suchergebnis").addEventListener("click", async e => {
  const k = e.target.closest("button[data-tun]");
  if(!k) return;
  const kasten = k.closest(".streffer");
  const alt = k.textContent;
  k.disabled = true; k.textContent = "…";
  try{
    const r = await fetch("/api/bibliothek/abspielen", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({album: kasten.dataset.album,
                            artist: kasten.dataset.artist,
                            modus: k.dataset.tun})});
    const d = await r.json().catch(() => ({}));
    if(!r.ok || d.ok === false) meldung(d.grund || "Nicht eingereiht.", 6000);
    else {
      let m = d.gesetzt + (k.dataset.tun === "ersetzen" ? " Titel eingereiht" : " Titel angehängt");
      if(d.fehler) m += ", " + d.fehler + " fehlgeschlagen";
      meldung(m, 5000);
      verlaufLaden();
    }
  }catch(err){ meldung("Nicht eingereiht.", 5000); }
  finally{ k.disabled = false; k.textContent = alt; }
});

function wannText(sek){
  const d = (Date.now()/1000) - sek;
  if(d < 3600)  return Math.max(1, Math.round(d/60)) + " Min";
  if(d < 86400) return Math.round(d/3600) + " Std";
  return Math.round(d/86400) + " Tg";
}

function verlaufLaden(){
  fetch("/api/verlauf").then(r => r.json()).then(d => {
    const e = d.eintraege || [];
    $("#s-verlauf").hidden = e.length === 0;
    $("#verlauf").innerHTML = e.map(v =>
      `<div class="vz" data-album="${esc(v.album||"")}" data-artist="${esc(v.artist||"")}">`+
      `<span>${esc(v.album||"—")}</span><span class="ar">${esc(v.artist||"")}</span>`+
      `<span class="wann">${wannText(v.zuletzt)}</span>`+
      (steuerungAn && !lesemodus ? `<button data-tun="ersetzen">abspielen</button>` : "")+
      `</div>`).join("");
  }).catch(()=>{});
}

$("#verlauf").addEventListener("click", async e => {
  const k = e.target.closest("button[data-tun]");
  if(!k) return;
  const z = k.closest(".vz");
  k.disabled = true;
  try{
    const r = await fetch("/api/bibliothek/abspielen", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({album: z.dataset.album, artist: z.dataset.artist,
                            modus: "ersetzen"})});
    const d = await r.json().catch(() => ({}));
    if(!r.ok || d.ok === false) meldung(d.grund || "Nicht eingereiht.", 6000);
    else meldung(d.gesetzt + " Titel eingereiht", 4000);
  }catch(err){ meldung("Nicht eingereiht.", 5000); }
  finally{ k.disabled = false; }
});

favListeLaden();
verlaufLaden();

// Startzustand der Steuerung holen
fetch("/api/steuerung/stand").then(r => r.json()).then(d => {
  steuerungAn = !!d.an;
  let l = false;
  try{ l = localStorage.getItem("liner-lesemodus") === "1"; }catch(e){}
  const u = new URLSearchParams(location.search);
  if(u.has("lesen")) l = u.get("lesen") !== "0";
  lesemodusSetzen(l, false);
  if(d.lautstaerke) volZeichnen(d.lautstaerke);
  if(!steuerungAn) $("#btn-lesen").hidden = true;
  bedienungSichtbar();
  // Suchen und Einreihen gehoert zur Steuerung: im Lesemodus verborgen.
  $("#s-suche").hidden = !steuerungAn || lesemodus;
  document.body.classList.toggle("springbar", steuerungAn && !lesemodus);
  verlaufLaden();
}).catch(() => { steuerungAn = false; bedienungSichtbar(); });

// Lautstärke gelegentlich nachziehen – sie hat kein eigenes Abo
setInterval(() => {
  if(!steuerungAn || lesemodus || document.hidden) return;
  fetch("/api/steuerung/stand").then(r => r.json())
    .then(d => { if(d.lautstaerke) volZeichnen(d.lautstaerke); }).catch(()=>{});
}, 20000);

fetch("/api/now").then(r => r.json()).then(zeichne).catch(()=>{});
verbinde();
</script>
